<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>오늘의 기록</title>
<style>
:root{--bg:#f7f7f5;--paper:#fff;--ink:#252522;--muted:#999991;--line:#ecece7;--accent:#627b68;--food:#d49a62;--task:#718b78}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}
.app{max-width:560px;min-height:100dvh;margin:auto;background:var(--bg);padding:env(safe-area-inset-top) 20px calc(92px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 18px}
.brand{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700}.today-link{border:0;background:#eeeee9;border-radius:99px;padding:9px 13px;color:#555;font-size:12px}
h1{font-size:29px;letter-spacing:-1.3px;margin:8px 0 5px;font-weight:750}.sub{font-size:13px;color:var(--muted);margin:0 0 24px}
.tabs{display:flex;background:#ecece8;border-radius:14px;padding:4px;margin-bottom:22px}
.tab{flex:1;border:0;background:transparent;border-radius:11px;padding:12px;color:#898982;font-size:14px;font-weight:650}
.tab.active{background:#fff;color:#292925;box-shadow:0 2px 8px #0000000a}
.datebar{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px}
.date-title{font-size:18px;font-weight:700;letter-spacing:-.5px}.date-actions{display:flex;gap:7px}
.iconbtn{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#555;font-size:18px}
.section{background:var(--paper);border-radius:20px;padding:19px 17px;margin-bottom:13px;box-shadow:0 3px 16px #22220806}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:750}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}.food-dot{background:var(--food)}.task-dot{background:var(--task)}
.count{font-size:11px;color:var(--muted);font-weight:500}
.add-small{border:0;background:#f4f4f0;color:#62625c;border-radius:99px;padding:7px 11px;font-size:12px}
.entry{display:flex;align-items:flex-start;gap:11px;padding:12px 1px;border-top:1px solid #f2f2ee}
.entry:first-of-type{border-top:0}.time{font-size:13px;color:#9b9b93;min-width:49px;padding-top:1px;font-variant-numeric:tabular-nums}
.entry-text{font-size:15px;line-height:1.5;flex:1;word-break:keep-all}.entry.done .entry-text{color:#aaa;text-decoration:line-through}
.check{appearance:none;width:19px;height:19px;border:1.5px solid #c9c9c1;border-radius:50%;margin:1px 0 0;flex:none;position:relative}
.check:checked{background:var(--task);border-color:var(--task)}.check:checked:after{content:"✓";position:absolute;color:white;font-size:12px;left:3px;top:0}
.entry-tools{display:flex;gap:4px;opacity:.0;transition:.15s}.entry:hover .entry-tools{opacity:1}
.mini{border:0;background:transparent;color:#aaa;font-size:12px;padding:2px 4px}
.empty{padding:8px 1px 5px;color:#b0b0a8;font-size:13px}
.fab{position:fixed;z-index:5;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 36px));border:0;border-radius:17px;background:#29372d;color:#fff;padding:16px;font-size:15px;font-weight:700;box-shadow:0 8px 25px #1d2b2026}
.calendar{background:#fff;border-radius:20px;padding:17px 13px 13px;box-shadow:0 3px 16px #22220806}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.weekdays{margin-bottom:8px}.weekdays span{font-size:11px;color:#aaa;padding:8px 0}.weekdays span:first-child{color:#d28b7c}.weekdays span:last-child{color:#8799b0}
.day{height:55px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#4c4c46;font-size:13px}
.day.muted{color:#c9c9c2}.day.selected{background:#eaf0eb;color:#35523d;font-weight:750}.day.today:not(.selected) .num{border-bottom:1px solid #718b78;padding-bottom:2px}
.markers{height:4px;display:flex;gap:3px}.marker{width:4px;height:4px;border-radius:50%}.marker.food{background:var(--food)}.marker.task{background:var(--task)}
.calendar-legend{display:flex;gap:14px;padding:14px 5px 2px;color:#999;font-size:11px}.legend-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.day-summary{margin-top:17px}.summary-date{font-size:17px;font-weight:750;margin:0 0 14px}.summary-section{margin-top:14px}.summary-label{font-size:12px;color:#92928a;font-weight:700;margin-bottom:7px}
.overlay{position:fixed;inset:0;background:#17191455;z-index:10;display:none;align-items:flex-end;justify-content:center;padding:12px}.overlay.show{display:flex}
.sheet{width:min(560px,100%);max-height:calc(100dvh - 24px);overflow-y:auto;overscroll-behavior:contain;background:#fff;border-radius:24px;padding:22px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px #0002}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet h2{font-size:19px;margin:0}.close{border:0;background:#f1f1ed;border-radius:50%;width:31px;height:31px;font-size:18px;color:#666}
.kind{display:flex;background:#f2f2ee;padding:4px;border-radius:12px;margin-bottom:15px}.kind button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;color:#888;font-size:13px}.kind button.active{background:#fff;color:#333;box-shadow:0 1px 5px #0000000c}
.field{margin:12px 0;min-width:0}.field label{display:block;font-size:12px;color:#85857d;margin-bottom:7px}.field input{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;border:1px solid #e9e9e3;border-radius:12px;padding:13px 12px;outline:none;background:#fff;font-size:16px}.field input:focus{border-color:#9aab9c}.field input[type="time"]{-webkit-appearance:none;appearance:none;text-align:center;padding-left:8px;padding-right:8px}.field input[type="time"]::-webkit-date-and-time-value{text-align:center}.field input[type="time"]::-webkit-calendar-picker-indicator{margin:0}
.save{width:100%;border:0;border-radius:13px;background:#29372d;color:white;padding:14px;font-weight:700;margin-top:8px}
.hidden{display:none!important}
.report-switch{display:flex;background:#ecece8;padding:4px;border-radius:13px;margin-bottom:12px}.report-period{flex:1;border:0;background:transparent;border-radius:10px;padding:10px;color:#888;font-size:13px}.report-period.active{background:#fff;color:#292925;font-weight:700;box-shadow:0 2px 8px #0000000a}
.report-range{font-size:12px;color:var(--muted);margin:0 2px 13px}.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:13px}.report-card{background:#fff;border-radius:17px;padding:15px;box-shadow:0 3px 16px #22220806;min-width:0}.report-label{font-size:11px;color:#92928a}.report-value{font-size:25px;font-weight:780;letter-spacing:-.8px;margin:7px 0 3px}.report-note{font-size:10px;color:#a0a098}.progress{height:5px;background:#efefeb;border-radius:9px;margin-top:11px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--task);border-radius:9px;transition:width .35s}
.report-section{margin-top:12px}.report-chart{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:142px;padding:10px 2px 0}.chart-col{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;min-width:0}.chart-track{height:105px;width:min(25px,75%);background:#f1f2ee;border-radius:8px 8px 4px 4px;display:flex;align-items:flex-end;overflow:hidden}.chart-bar{width:100%;height:0;background:#829786;border-radius:8px 8px 3px 3px;transition:height .35s}.chart-num{font-size:9px;color:#8e8e86}.chart-label{font-size:10px;color:#92928a}.report-insight{font-size:13px;line-height:1.8;color:#66665e}
.section,.report-card,.calendar{border:1px solid #f0f0eb;box-shadow:0 5px 22px rgba(48,48,35,.035)}
.section{padding:20px 18px}
.report-card{padding:17px 16px 16px;border-radius:19px;position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.report-card:after{content:"";position:absolute;top:0;left:16px;right:16px;height:2px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#dce8dc,#f3eadb);opacity:.9}
.report-label{font-size:11px;letter-spacing:-.1px;color:#8d9189}
.report-value{font-size:27px;line-height:1.15;color:#303b32;margin:9px 0 5px;font-variant-numeric:tabular-nums}
.report-note{font-size:10px;line-height:1.5;color:#a0a39b}
.progress{height:7px;background:#f0f2ed;border-radius:99px;margin-top:13px}
.progress i{background:linear-gradient(90deg,#b7cbb8,#78947d);border-radius:99px}
.report-section{padding:20px 18px}
.report-section .section-head{margin-bottom:10px}
.report-chart{height:158px;gap:5px;padding:13px 0 0}
.chart-col{gap:8px}
.chart-track{height:112px;width:min(28px,76%);background:#f0f3ee;border-radius:99px;overflow:hidden}
.chart-bar{background:linear-gradient(180deg,#a9c2aa,#718d76);border-radius:99px 99px 5px 5px;min-height:0}
.chart-num{font-size:10px;font-weight:650;color:#7f9281;font-variant-numeric:tabular-nums}
.chart-label{font-size:10px;color:#92968e}
.report-insight strong{color:#526e58;font-weight:750}
.section-title{letter-spacing:-.35px}
@media(hover:hover){.report-card:hover{transform:translateY(-2px);box-shadow:0 9px 25px rgba(48,48,35,.065)}}
.timeline-entry{display:flex;gap:10px;position:relative;padding:12px 0;border-top:1px solid #f2f2ee}.timeline-entry:first-child{border-top:0}.timeline-axis{width:49px;flex:none;font-size:12px;color:#999990;padding-top:2px;font-variant-numeric:tabular-nums}.timeline-mark{position:absolute;left:54px;top:18px;width:7px;height:7px;border-radius:50%;z-index:1}.timeline-content{margin-left:8px;flex:1;min-width:0;display:flex;align-items:flex-start;gap:8px}.timeline-kind{font-size:10px;color:#a0a098;background:#f5f5f1;border-radius:5px;padding:3px 6px;flex:none}.timeline-entry.food .timeline-mark{background:var(--food)}.timeline-entry.task .timeline-mark{background:var(--task)}.timeline-entry.done .entry-text{color:#aaa;text-decoration:line-through}
.habit-row{display:flex;align-items:center;gap:11px;padding:12px 1px;border-top:1px solid #f2f2ee}
.habit-row:first-child{border-top:0}.habit-check{appearance:none;width:20px;height:20px;border:1.5px solid #c9c9c1;border-radius:7px;margin:0;flex:none;position:relative}
.habit-check:checked{background:#78947d;border-color:#78947d}.habit-check:checked:after{content:"✓";position:absolute;color:white;font-size:13px;left:3px;top:0}
.habit-name{flex:1;font-size:14px;color:#44443e}.habit-row.done .habit-name{color:#a3a69e;text-decoration:line-through}
.habit-empty{font-size:12px;color:#aaa99f;padding:5px 0 10px;line-height:1.6}
.report-actions{display:flex;justify-content:flex-end;margin:0 0 12px}
.export-btn{border:1px solid #e5e9e2;background:#f5f7f3;color:#5e765f;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:650}
@media(min-width:600px){body{padding:20px 0}.app{border-radius:28px;min-height:calc(100dvh - 40px);box-shadow:0 10px 45px #0000000a}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">MY DAILY NOTE</div><button class="today-link" id="goToday">오늘로 이동</button></div>
  <h1 id="pageTitle">오늘의 기록</h1><p class="sub">먹은 것과 해야 할 일을 생각날 때마다 편하게 기록해요.</p>
  <div class="tabs"><button class="tab active" data-tab="daily">오늘 기록</button><button class="tab" data-tab="calendar">캘린더</button><button class="tab" data-tab="report">리포트</button></div>
  <div id="dailyView">
    <div class="datebar"><div class="date-title" id="dailyDate"></div><div class="date-actions"><button class="iconbtn" id="prevDay">‹</button><button class="iconbtn" id="nextDay">›</button></div></div>
    <section class="section"><div class="section-head"><div class="section-title">하루 타임라인 <span class="count" id="timelineCount"></span></div><div style="display:flex;gap:6px"><button class="add-small" data-add="food">＋ 식단</button><button class="add-small" data-add="task">＋ 할 일</button></div></div><div id="timelineList"></div></section>
    <section class="section"><div class="section-head"><div class="section-title">매일의 습관 <span class="count" id="habitProgress">0/0 완료</span></div><button class="add-small" id="addHabit">＋ 습관 추가</button></div><div id="habitList"></div></section>
  </div>
  <div id="calendarView" class="hidden">
    <div class="datebar"><div class="date-title" id="monthTitle"></div><div class="date-actions"><button class="iconbtn" id="prevMonth">‹</button><button class="iconbtn" id="nextMonth">›</button></div></div>
    <div class="calendar"><div class="weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div><div class="calendar-legend"><span><i class="legend-dot" style="background:var(--food)"></i>식단 기록</span><span><i class="legend-dot" style="background:var(--task)"></i>할 일</span></div></div>
    <div class="day-summary"><h3 class="summary-date" id="summaryDate"></h3><section class="section"><div class="summary-section"><div class="summary-label">식단</div><div id="summaryFood"></div></div><div class="summary-section"><div class="summary-label">할 일</div><div id="summaryTasks"></div></div><div style="display:flex;gap:8px;margin-top:15px"><button class="add-small" data-add="food">＋ 식단 기록</button><button class="add-small" data-add="task">＋ 할 일 추가</button></div></section></div>
  </div>
  <div id="reportView" class="hidden">
    <div class="datebar"><div class="date-title">나의 기록 리포트</div></div>
    <div class="report-switch"><button class="report-period active" data-period="week">주간</button><button class="report-period" data-period="month">월간</button></div>
    <div class="report-range" id="reportRange"></div>
    <div class="report-grid">
      <div class="report-card"><div class="report-label">할 일 완료율</div><div class="report-value" id="completionRate">0%</div><div class="report-note" id="taskSummary">완료 0 / 전체 0개</div><div class="progress"><i id="completionBar"></i></div></div>
      <div class="report-card"><div class="report-label">식단 기록</div><div class="report-value" id="foodTotal">0회</div><div class="report-note" id="foodDays">기록한 날 0일</div></div>
      <div class="report-card"><div class="report-label">할 일 완료</div><div class="report-value" id="doneTotal">0개</div><div class="report-note">선택한 기간 기준</div></div>
      <div class="report-card"><div class="report-label">기록한 날짜</div><div class="report-value" id="activeDays">0일</div><div class="report-note">식단 또는 할 일 기록</div></div>
    </div>
    <section class="section report-section"><div class="section-head"><div class="section-title" id="chartTitle">요일별 할 일 완료율</div></div><div id="reportChart" class="report-chart"></div></section>
    <section class="section report-section"><div class="section-head"><div class="section-title">기간 요약</div></div><div id="reportInsight" class="report-insight"></div></section>
    <div class="report-actions"><button class="export-btn" id="exportCsv">↓ 기록 CSV 내보내기</button></div>
  </div>
</div>
<button class="fab" id="quickAdd">＋ 기록 추가하기</button>
<div class="overlay" id="overlay"><div class="sheet">
  <div class="sheet-top"><h2 id="formTitle">새 기록</h2><button class="close" id="close">×</button></div>
  <div class="kind"><button class="active" data-kind="food">식단 기록</button><button data-kind="task">할 일</button></div>
  <div class="field"><label for="entryTime">시간</label><input id="entryTime" type="time" value="12:00"></div>
  <div class="field"><label for="entryText">내용</label><input id="entryText" type="text" placeholder="무엇을 먹었나요?" maxlength="120"></div>
  <button class="save" id="save">기록 저장하기</button>
</div></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date(); let selected=iso(now), viewMonth=new Date(now.getFullYear(),now.getMonth(),1), kind='food', editing=null, activeTab='daily';
let records={}; try{records=JSON.parse(localStorage.getItem('daily-note-records')||'{}')}catch(e){records={}}
const parse=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const weekdays=['일','월','화','수','목','금','토'];
const dateLabel=s=>{let d=parse(s);return `${d.getMonth()+1}/${d.getDate()} ${weekdays[d.getDay()]}`};
const items=()=>records[selected]||{food:[],task:[],habits:[]};
let habits=[];try{habits=JSON.parse(localStorage.getItem('daily-note-habits')||'[]')}catch(e){habits=[]}
function persist(){localStorage.setItem('daily-note-records',JSON.stringify(records));render()}
function render(){
 $('#dailyDate').textContent=dateLabel(selected);renderTimeline();renderHabits();renderCalendar();renderSummary();renderReport();
}
function renderHabits(){
 const completed=items().habits||[];
 $('#habitProgress').textContent=completed.filter(id=>habits.some(h=>h.id===id)).length+'/'+habits.length+' 완료';
 if(!habits.length){$('#habitList').innerHTML='<div class="habit-empty">매일 반복하고 싶은 습관을 추가해보세요. 예: 물 2L 마시기, 운동하기</div>';return}
 $('#habitList').innerHTML=habits.map(h=>{const done=completed.includes(h.id);return '<div class="habit-row '+(done?'done':'')+'"><input class="habit-check" type="checkbox" data-habit="'+h.id+'" '+(done?'checked':'')+'><span class="habit-name">'+escapeHtml(h.name)+'</span><button class="mini habit-delete" data-delete-habit="'+h.id+'">삭제</button></div>'}).join('');
 $('#habitList').querySelectorAll('[data-habit]').forEach(cb=>cb.onchange=()=>{if(!records[selected])records[selected]={food:[],task:[],habits:[]};if(!records[selected].habits)records[selected].habits=[];const id=cb.dataset.habit;records[selected].habits=cb.checked?[...new Set([...records[selected].habits,id])]:records[selected].habits.filter(x=>x!==id);persist()});
 $('#habitList').querySelectorAll('[data-delete-habit]').forEach(btn=>btn.onclick=()=>{const h=habits.find(x=>x.id===btn.dataset.deleteHabit);if(h&&confirm('"'+h.name+'" 습관을 목록에서 삭제할까요?')){habits=habits.filter(x=>x.id!==h.id);localStorage.setItem('daily-note-habits',JSON.stringify(habits));persist()}});
}
$('#addHabit').onclick=()=>{const name=prompt('매일 기록할 습관을 입력해 주세요.');if(!name||!name.trim())return;habits.push({id:'h'+Date.now().toString(36),name:name.trim().slice(0,40)});localStorage.setItem('daily-note-habits',JSON.stringify(habits));renderHabits()};
function renderTimeline(){
 const all=[...(items().food||[]).map(x=>({...x,type:'food'})),...(items().task||[]).map(x=>({...x,type:'task'}))].sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
 $('#timelineCount').textContent=all.length?all.length+'개 기록':'';
 if(!all.length){$('#timelineList').innerHTML='<div class="empty">아직 기록이 없어요. 식단이나 할 일을 추가해보세요.</div>';return}
 $('#timelineList').innerHTML=all.map(x=>'<div class="timeline-entry '+x.type+' '+(x.done?'done':'')+'" data-id="'+x.id+'" data-type="'+x.type+'"><span class="timeline-axis">'+(x.time||'시간 미정')+'</span><i class="timeline-mark"></i><div class="timeline-content">'+(x.type==='task'?'<input class="check" type="checkbox" '+(x.done?'checked':'')+' aria-label="완료">':'')+'<span class="timeline-kind">'+(x.type==='food'?'식단':'할 일')+'</span><span class="entry-text">'+escapeHtml(x.text)+'</span><span class="entry-tools"><button class="mini edit">수정</button><button class="mini delete">삭제</button></span></div></div>').join('');
 $('#timelineList').querySelectorAll('.timeline-entry').forEach(el=>{const id=el.dataset.id,type=el.dataset.type,edit=el.querySelector('.edit'),del=el.querySelector('.delete'),cb=el.querySelector('.check');if(edit)edit.onclick=()=>openForm(type,id);if(del)del.onclick=()=>{if(confirm('이 기록을 삭제할까요?')){records[selected][type]=records[selected][type].filter(x=>x.id!==id);persist()}};if(cb)cb.onchange=()=>{const x=records[selected].task.find(v=>v.id===id);if(x){x.done=cb.checked;persist()}}});
}
function renderList(type,target){
 const arr=items()[type]||[];
 if(!arr.length){target.innerHTML=`<div class="empty">${type==='food'?'아직 식단 기록이 없어요. 먹은 것을 바로 적어보세요.':'오늘 해야 할 일을 자유롭게 추가해보세요.'}</div>`;return}
 target.innerHTML=arr.map(x=>`<div class="entry ${x.done?'done':''}" data-id="${x.id}">
 ${type==='task'?`<input class="check" type="checkbox" ${x.done?'checked':''} aria-label="완료">`:''}
 <span class="time">${x.time||'시간 미정'}</span><span class="entry-text">${escapeHtml(x.text)}</span>
 <span class="entry-tools"><button class="mini edit">수정</button><button class="mini delete">삭제</button></span></div>`).join('');
 target.querySelectorAll('.entry').forEach(el=>{
  const id=el.dataset.id;
  el.querySelector('.edit').onclick=()=>openForm(type,id);
  el.querySelector('.delete').onclick=()=>{if(confirm('이 기록을 삭제할까요?')){records[selected][type]=records[selected][type].filter(x=>x.id!==id);persist()}};
  const cb=el.querySelector('.check');if(cb)cb.onchange=()=>{let x=records[selected].task.find(v=>v.id===id);x.done=cb.checked;persist()};
 });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderCalendar(){
 $('#monthTitle').textContent=`${viewMonth.getFullYear()}년 ${viewMonth.getMonth()+1}월`;
 const y=viewMonth.getFullYear(),m=viewMonth.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());
 let out='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d),r=records[key]||{food:[],task:[]},inside=d.getMonth()===m;
 out+=`<button class="day ${inside?'':'muted'} ${key===selected?'selected':''} ${key===iso(now)?'today':''}" data-date="${key}"><span class="num">${d.getDate()}</span><span class="markers">${r.food.length?'<i class="marker food"></i>':''}${r.task.length?'<i class="marker task"></i>':''}</span></button>`}
 $('#days').innerHTML=out;$('#days').querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render();});
}
function renderSummary(){
 $('#summaryDate').textContent=dateLabel(selected)+' 기록';
 const r=items();
 $('#summaryFood').innerHTML=r.food.length?r.food.map(x=>`<div class="entry"><span class="time">${x.time||'--:--'}</span><span class="entry-text">${escapeHtml(x.text)}</span></div>`).join(''):'<div class="empty">기록된 식단이 없어요.</div>';
 $('#summaryTasks').innerHTML=r.task.length?r.task.map(x=>`<div class="entry ${x.done?'done':''}"><input class="check" type="checkbox" data-task="${x.id}" ${x.done?'checked':''}><span class="time">${x.time||'--:--'}</span><span class="entry-text">${escapeHtml(x.text)}</span></div>`).join(''):'<div class="empty">등록된 할 일이 없어요.</div>';
 $('#summaryTasks').querySelectorAll('[data-task]').forEach(cb=>cb.onchange=()=>{let x=records[selected].task.find(v=>v.id===cb.dataset.task);x.done=cb.checked;persist()});
}
function switchTab(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#dailyView').classList.toggle('hidden',tab!=='daily');$('#calendarView').classList.toggle('hidden',tab!=='calendar');$('#reportView').classList.toggle('hidden',tab!=='report');$('#pageTitle').textContent=tab==='daily'?'오늘의 기록':tab==='calendar'?'월간 캘린더':'나의 리포트';$('#quickAdd').classList.toggle('hidden',tab==='report');$('#quickAdd').textContent=tab==='daily'?'＋ 기록 추가하기':'＋ 선택한 날짜에 기록하기';if(tab==='report')renderReport()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('#prevDay').onclick=()=>{let d=parse(selected);d.setDate(d.getDate()-1);selected=iso(d);viewMonth=new Date(d.getFullYear(),d.getMonth(),1);render()};
$('#nextDay').onclick=()=>{let d=parse(selected);d.setDate(d.getDate()+1);selected=iso(d);viewMonth=new Date(d.getFullYear(),d.getMonth(),1);render()};
$('#prevMonth').onclick=()=>{viewMonth.setMonth(viewMonth.getMonth()-1);renderCalendar()};
$('#nextMonth').onclick=()=>{viewMonth.setMonth(viewMonth.getMonth()+1);renderCalendar()};
let reportPeriod='week';
document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{reportPeriod=b.dataset.period;document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===b));renderReport()});
function renderReport(){
 if(!$('#reportView'))return;const end=parse(iso(now)),start=new Date(end);if(reportPeriod==='week')start.setDate(end.getDate()-6);else start.setDate(1);
 const keys=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))keys.push(iso(d));
 const totals=keys.map(k=>{const r=records[k]||{food:[],task:[]};return {key:k,food:r.food||[],task:r.task||[]}});
 const allTasks=totals.flatMap(x=>x.task),done=allTasks.filter(x=>x.done).length,foodCount=totals.reduce((n,x)=>n+x.food.length,0),foodDays=totals.filter(x=>x.food.length).length,active=totals.filter(x=>x.food.length||x.task.length).length,rate=allTasks.length?Math.round(done/allTasks.length*100):0;
 $('#reportRange').textContent=reportPeriod==='week'?(start.getMonth()+1)+'/'+start.getDate()+' - '+(end.getMonth()+1)+'/'+end.getDate():end.getFullYear()+'년 '+(end.getMonth()+1)+'월 1일 - 오늘';
 $('#completionRate').textContent=rate+'%';$('#taskSummary').textContent='완료 '+done+' / 전체 '+allTasks.length+'개';$('#completionBar').style.width=rate+'%';$('#foodTotal').textContent=foodCount+'회';$('#foodDays').textContent='기록한 날 '+foodDays+'일';$('#doneTotal').textContent=done+'개';$('#activeDays').textContent=active+'일';
 const chart=reportPeriod==='week'?totals:totals.filter((x,i)=>i%Math.ceil(totals.length/7)===0||i===totals.length-1);$('#chartTitle').textContent=reportPeriod==='week'?'일자별 할 일 완료율':'월간 할 일 완료 추이';
 $('#reportChart').innerHTML=chart.map(x=>{const n=x.task.length,d=x.task.filter(t=>t.done).length,p=n?Math.round(d/n*100):0;return '<div class="chart-col"><span class="chart-num">'+(n?p+'%':'-')+'</span><div class="chart-track"><i class="chart-bar" style="height:'+p+'%"></i></div><span class="chart-label">'+parse(x.key).getDate()+'일</span></div>'}).join('');
 const best=totals.reduce((a,x)=>x.task.filter(t=>t.done).length>a.done?{key:x.key,done:x.task.filter(t=>t.done).length}:a,{key:'',done:0});$('#reportInsight').innerHTML='선택한 기간에 식단을 <strong>'+foodCount+'회</strong> 기록했고, 총 <strong>'+allTasks.length+'개</strong>의 할 일 중 <strong>'+done+'개</strong>를 완료했어요. '+(allTasks.length?'완료율은 <strong>'+rate+'%</strong>예요.':'할 일을 기록하면 완료율을 확인할 수 있어요.')+(best.done?' 가장 많은 일을 완료한 날은 <strong>'+dateLabel(best.key)+'</strong>로 '+best.done+'개예요.':'');
}
$('#goToday').onclick=()=>{selected=iso(now);viewMonth=new Date(now.getFullYear(),now.getMonth(),1);render();switchTab('daily')};
function openForm(type='food',id=null){
 kind=type;editing=id;$('#entryText').value='';$('#entryTime').value='12:00';
 if(id){let x=(records[selected]?.[type]||[]).find(v=>v.id===id);if(x){$('#entryText').value=x.text;$('#entryTime').value=x.time||'12:00'}}
 document.querySelectorAll('[data-kind]').forEach(b=>b.classList.toggle('active',b.dataset.kind===type));
 $('#entryText').placeholder=type==='food'?'무엇을 먹었나요?':'오늘 할 일을 적어보세요.';
 $('#formTitle').textContent=id?'기록 수정':'새 기록 추가';$('#save').textContent=id?'수정 완료':'기록 저장하기';openModal();
}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openForm(b.dataset.add));
$('#quickAdd').onclick=()=>openForm('food');
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));$('#entryText').placeholder=kind==='food'?'무엇을 먹었나요?':'오늘 할 일을 적어보세요.'});
let savedScrollY=0;
function openModal(){savedScrollY=window.scrollY;document.body.style.position='fixed';document.body.style.top=`-${savedScrollY}px`;document.body.style.left='0';document.body.style.right='0';document.body.style.width='100%';$('#overlay').classList.add('show');}
function closeModal(){ $('#overlay').classList.remove('show');document.body.style.position='';document.body.style.top='';document.body.style.left='';document.body.style.right='';document.body.style.width='';window.scrollTo(0,savedScrollY);}
$('#close').onclick=closeModal;
$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeModal()};
$('#save').onclick=()=>{
 let text=$('#entryText').value.trim();if(!text){$('#entryText').focus();return}
 if(!records[selected])records[selected]={food:[],task:[]};
 let arr=records[selected][kind],time=$('#entryTime').value;
 if(editing){let x=arr.find(v=>v.id===editing);if(x){x.text=text;x.time=time}}
 else arr.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,time,done:false});
 closeModal();editing=null;persist();
};
function exportCsv(){
 const rows=[['날짜','유형','시간','내용','완료 여부']];
 Object.keys(records).sort().forEach(date=>{
  const r=records[date]||{};
  (r.food||[]).forEach(x=>rows.push([date,'식단',x.time||'',x.text,'']));
  (r.task||[]).forEach(x=>rows.push([date,'할 일',x.time||'',x.text,x.done?'완료':'미완료']));
  (r.habits||[]).forEach(id=>{const h=habits.find(v=>v.id===id);if(h)rows.push([date,'습관','',h.name,'완료'])});
 });
 habits.forEach(h=>rows.push(['','습관 목록','',h.name,'']));
 const csv='\\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='my-daily-note-'+iso(new Date())+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
$('#exportCsv').onclick=exportCsv;
render();
</script>
</body></html>
